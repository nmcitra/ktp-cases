name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-hygiene.sh

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit in the PR carries a DCO sign-off
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: .* <.*>'; then
              echo "::error::missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "DCO: all commits signed off"

  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml==6.0.2
      - name: Case-set structure
        run: python3 scripts/check-cases.py
